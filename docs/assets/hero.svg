<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-label="10c-dev: a delivery workflow for coding agents, with the rung ladder R0 probe, R1 PoC, R2 MVP, R3 hardened">
  <title>10c-dev — a delivery workflow for coding agents</title>
  <defs>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#111827"/>
      <stop offset="100%" stop-color="#0b1220"/>
    </linearGradient>
    <style>
      .t { font-family: ui-sans-serif, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    </style>
  </defs>

  <rect x="0" y="0" width="1200" height="320" rx="20" fill="url(#panel)"/>
  <rect x="0.5" y="0.5" width="1199" height="319" rx="20" fill="none" stroke="#334155" stroke-width="1"/>

  <!-- left: wordmark and tagline -->
  <rect x="64" y="72" width="6" height="52" rx="3" fill="#38bdf8"/>
  <text class="t" x="88" y="116" font-size="54" font-weight="700" fill="#e2e8f0">10c-dev</text>
  <text class="t" x="90" y="156" font-size="21" fill="#94a3b8">A delivery workflow for coding agents.</text>
  <text class="t" x="90" y="196" font-size="15" fill="#64748b">ticket &#8594; rung &#8594; interview &#8594; spec &#8594; build &#8594; verify &#8594; review &#8594; push</text>
  <text class="t" x="90" y="222" font-size="15" fill="#64748b">One config file in your repo. Nothing about your stack is baked in.</text>

  <!-- right: the rung ladder -->
  <line x1="688" y1="248" x2="1148" y2="248" stroke="#334155" stroke-width="2"/>

  <rect x="700" y="202" width="88" height="46" rx="6" fill="#475569"/>
  <text class="t" x="744" y="192" font-size="13" fill="#94a3b8" text-anchor="middle">probe</text>
  <text class="t" x="744" y="272" font-size="16" font-weight="600" fill="#cbd5e1" text-anchor="middle">R0</text>

  <rect x="812" y="164" width="88" height="84" rx="6" fill="#0ea5e9"/>
  <text class="t" x="856" y="154" font-size="13" fill="#94a3b8" text-anchor="middle">PoC</text>
  <text class="t" x="856" y="272" font-size="16" font-weight="600" fill="#cbd5e1" text-anchor="middle">R1</text>

  <rect x="924" y="126" width="88" height="122" rx="6" fill="#22c55e"/>
  <text class="t" x="968" y="116" font-size="13" fill="#94a3b8" text-anchor="middle">MVP</text>
  <text class="t" x="968" y="272" font-size="16" font-weight="600" fill="#cbd5e1" text-anchor="middle">R2</text>

  <rect x="1036" y="88" width="88" height="160" rx="6" fill="#f59e0b"/>
  <text class="t" x="1080" y="78" font-size="13" fill="#94a3b8" text-anchor="middle">hardened</text>
  <text class="t" x="1080" y="272" font-size="16" font-weight="600" fill="#cbd5e1" text-anchor="middle">R3</text>

  <text class="t" x="918" y="300" font-size="13" fill="#64748b" text-anchor="middle">the ratchet is one-way &#8212; it climbs only with your agreement</text>
</svg>
